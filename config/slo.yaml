service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: 'Giữ mục tiêu 99.5% request thành công và latency <=3000ms trong 28 ngày. Baseline local là mẫu nhỏ, không chứng minh SLO 28 ngày. Error budget = N * 0.005; 10,000 request cho phép tối đa 50 bad events (lỗi hoặc chậm, không đếm hai lần). Dùng latency_ms của agent theo contract; x-response-time-ms bổ sung thời gian toàn HTTP. Rà lại ngưỡng với dữ liệu vận hành dài hạn.'
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
